name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pin@v6.0.3
        with:
          persist-credentials: false

      - name: build
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          output_root="$(mktemp -d "${RUNNER_TEMP}/birki-build.XXXXXX")"
          script/build "${GITHUB_WORKSPACE}" "${output_root}" "${SOURCE_SHA}"

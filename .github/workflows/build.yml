name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: openai/fence@c7675fea986c29f1d655753a7a61fd6b4141be8f # pin@v0.13.0
        name: fence
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - name: build
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          output_root="$(mktemp -d "${RUNNER_TEMP}/birki-build.XXXXXX")"
          script/build "${GITHUB_WORKSPACE}" "${output_root}" "${SOURCE_SHA}"

name: deploy

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - ".gitignore"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  queue: max

defaults:
  run:
    shell: bash

jobs:
  deployment-check:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      continue: ${{ steps.deployment-check.outputs.continue }}

    steps:
      - uses: openai/fence@db291f5c51949e6e6ec1634621b36dc4bbf3d54a # pin@v0.8.7

      - name: deployment check
        uses: github/branch-deploy@ddf8ca48e9cdb2d2c7c71dee428308b19af9313f # pin@v11.1.4
        id: deployment-check
        with:
          merge_deploy_mode: "true"
          environment: github-pages

  build:
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.deployment-check.outputs.continue == 'true') }}
    needs: deployment-check
    runs-on: ubuntu-24.04

    steps:
      - uses: openai/fence@db291f5c51949e6e6ec1634621b36dc4bbf3d54a # pin@v0.8.7

      - name: checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pin@v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: verify source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # pin@v6.0.0

      - name: build exact source
        id: build
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          artifact_root="$(mktemp -d "${RUNNER_TEMP}/birki-pages.XXXXXX")"
          script/build "${GITHUB_WORKSPACE}" "${artifact_root}" "${SOURCE_SHA}"
          echo "artifact_root=${artifact_root}" >> "${GITHUB_OUTPUT}"

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pin@v5.0.0
        with:
          path: ${{ steps.build.outputs.artifact_root }}

  deploy:
    if: ${{ needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: openai/fence@db291f5c51949e6e6ec1634621b36dc4bbf3d54a # pin@v0.8.7

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pin@v5.0.0

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions: {}

    steps:
      - uses: openai/fence@db291f5c51949e6e6ec1634621b36dc4bbf3d54a # pin@v0.8.7
        with:
          allowlist: |
            hostname birki.io tcp 443

      - name: verify live source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WEB_URL: https://birki.io
        run: |
          for attempt in {1..12}; do
            actual_sha="$(curl --fail --silent --show-error --location --max-time 10 "${WEB_URL}/version.txt?sha=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            if [ "${actual_sha}" = "${EXPECTED_SHA}" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "Live version did not reach ${EXPECTED_SHA}." >&2
          exit 1

# https://github.com/github/branch-deploy/blob/d3c24bd92505e623615b75ffdfac5ed5259adbdb/docs/unlock-on-merge.md

name: Unlock On Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

cache-mode: none

jobs:
  unlock-on-merge:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged == true

    steps:
      - uses: openai/fence@63c516e78543f3d8d6088ebad6475a39920863bd # pin@v0.10.2

      - name: unlock on merge
        uses: grantbirki/branch-deploy@7173dcbb72a30da0148076fade87260ddd1b5e28 # pin@v12.4.2
        id: unlock-on-merge
        with:
          unlock_on_merge_mode: "true"
          environment_targets: "github-pages"

name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: openai/fence@c7675fea986c29f1d655753a7a61fd6b4141be8f # pin@v0.13.0
        name: fence
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: test
        run: script/test
